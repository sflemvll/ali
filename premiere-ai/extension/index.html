<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>مساعد بريمير الذكي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <span id="dot" class="dot off"></span>
    <span id="status">غير متصل بالسيرفر</span>
    <button id="settingsBtn" title="الإعدادات">⚙</button>
  </header>

  <section id="settings" class="settings hidden">
    <label>عنوان السيرفر المحلي</label>
    <input id="serverUrl" type="text" value="ws://127.0.0.1:8777/ws/panel">
    <label class="row">
      <input id="autoRun" type="checkbox" checked>
      تنفيذ الأوامر تلقائياً بدون تأكيد
    </label>
    <label class="row">
      <input id="showCode" type="checkbox" checked>
      إظهار الكود المُنفَّذ
    </label>
    <div class="row">
      <button id="reconnectBtn">إعادة الاتصال</button>
      <button id="resetBtn">محادثة جديدة</button>
    </div>
  </section>

  <main id="chat" class="chat">
    <div class="msg sys">
      اكتب شنو تريد وآني أنفذه داخل بريمير.
      مثال: «اجمع كل الفيديوات من البِن Footage على التايم لاين وحط بينهم Cross Dissolve نص ثانية».
    </div>
  </main>

  <footer class="composer">
    <textarea id="input" rows="2" placeholder="اكتب طلبك هنا… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
    <button id="send">إرسال</button>
  </footer>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
